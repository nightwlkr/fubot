[alembic]
script_location = alembic
pre_alembic_hook = python -c "import sys; sys.path.insert(0, '.'); from backend.config import settings; print(settings.DATABASE_URL)"
version_path_separator = os

[post_write_flush]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

[post/read/watch]
# Use DATABASE_URL from backend.config.settings
sqlalchemy.url = driver://user:pass@localhost/dbname
